<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ComicCraft — Create stunning AI-powered comic stories in seconds. Choose your character, setting, and style.">
    <title>COMICCRAFT — AI Comic Story Creator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
/* ── CSS Variables ── */
:root {
    --red:       #ff4757;
    --red-dark:  #c0392b;
    --navy:      #1a1a2e;
    --navy-mid:  #16213e;
    --navy-card: #0f3460;
    --gold:      #ffd32a;
    --white:     #ffffff;
    --gray-100:  #f8f9fa;
    --gray-200:  #e9ecef;
    --gray-400:  #adb5bd;
    --gray-600:  #6c757d;
    --text:      #1a1a2e;
    --radius-sm:  8px;
    --radius-md:  14px;
    --radius-lg:  20px;
    --shadow-sm:  0 2px 8px rgba(0,0,0,.12);
    --shadow-md:  0 6px 24px rgba(0,0,0,.18);
    --shadow-lg:  0 12px 40px rgba(0,0,0,.25);
    --transition: .25s cubic-bezier(.4,0,.2,1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--navy);
    color: var(--white);
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
}
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
        radial-gradient(circle at 20% 20%, rgba(255,71,87,.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255,211,42,.08) 0%, transparent 50%),
        radial-gradient(1px 1px at 40px 60px, rgba(255,255,255,.06) 0%, transparent 100%),
        radial-gradient(1px 1px at 120px 20px, rgba(255,255,255,.05) 0%, transparent 100%),
        radial-gradient(1px 1px at 200px 100px, rgba(255,255,255,.04) 0%, transparent 100%);
    z-index: -1;
    pointer-events: none;
}
.container { width: 100%; max-width: 960px; margin: 0 auto; padding: 1rem; }
header { text-align: center; padding: 2rem 0 1.5rem; }
.logo {
    font-family: 'Bangers', cursive;
    font-size: clamp(2.8rem, 10vw, 5rem);
    letter-spacing: 4px;
    color: var(--red);
    text-shadow: 3px 3px 0 var(--gold), 6px 6px 0 rgba(0,0,0,.3);
    line-height: 1;
    display: block;
    animation: logoEntrance .6s ease-out both;
}
@keyframes logoEntrance {
    from { opacity: 0; transform: translateY(-20px) scale(.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}
header .tagline {
    font-size: clamp(.85rem, 3vw, 1.1rem);
    color: var(--gray-400);
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: .5rem;
}
.card {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    box-shadow: var(--shadow-md);
}
.form-group { margin-bottom: 1.25rem; }
.form-row { display: grid; grid-template-columns: 1fr; gap: 1rem; }
@media (min-width: 540px) { .form-row { grid-template-columns: repeat(3, 1fr); } }
label {
    display: block; margin-bottom: .4rem; font-size: .85rem;
    font-weight: 600; color: var(--gray-400);
    text-transform: uppercase; letter-spacing: .8px;
}
input, select, textarea {
    width: 100%; padding: .85rem 1rem;
    background: rgba(255,255,255,.08);
    border: 1.5px solid rgba(255,255,255,.15);
    border-radius: var(--radius-sm);
    color: var(--white); font-size: 1rem; font-family: inherit;
    transition: border-color var(--transition), background var(--transition);
    -webkit-appearance: none; appearance: none;
}
input::placeholder, textarea::placeholder { color: var(--gray-600); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--red); background: rgba(255,255,255,.12); }
select option { background: var(--navy-mid); color: var(--white); }
.btn {
    display: block; width: 100%; padding: 1rem 1.5rem;
    background: linear-gradient(135deg, var(--red), var(--red-dark));
    color: var(--white); border: none; border-radius: var(--radius-sm);
    font-size: 1.05rem; font-weight: 700; font-family: inherit;
    cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px;
    text-align: center; text-decoration: none;
    transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
    position: relative; overflow: hidden;
}
.btn::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.15), transparent);
    opacity: 0; transition: opacity var(--transition);
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,71,87,.4); }
.btn:hover::after { opacity: 1; }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
.hidden { display: none !important; }
#loading { text-align: center; padding: 2rem 0 .5rem; }
#loading p { color: var(--gray-400); font-size: .95rem; margin-top: .75rem; }
.spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,.1);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin .9s linear infinite;
    margin: 0 auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <span class="logo">COMICCRAFT</span>
            <p class="tagline">✦ AI Comic Story Creator ✦</p>
        </header>

        <main class="card">
            <form id="comicForm" action="/generate" method="POST" novalidate>

                <div class="form-group">
                    <label for="story_prompt">Story Prompt</label>
                    <textarea id="story_prompt" name="story_prompt" rows="3" required
                        placeholder="e.g. A brave fox discovers a hidden portal in the enchanted forest..."></textarea>
                </div>

                <div class="form-group">
                    <label for="character_name">Main Character Name</label>
                    <input type="text" id="character_name" name="character_name" required
                        placeholder="e.g. Leo">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="setting">Setting</label>
                        <select id="setting" name="setting" required>
                            <option value="Forest">🌲 Forest</option>
                            <option value="School">🏫 School</option>
                            <option value="City">🏙️ City</option>
                            <option value="Space">🚀 Space</option>
                            <option value="Village">🏡 Village</option>
                            <option value="Fantasy Kingdom">🏰 Fantasy Kingdom</option>
                            <option value="Ocean">🌊 Ocean</option>
                            <option value="Desert">🏜️ Desert</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="tone">Story Tone</label>
                        <select id="tone" name="tone" required>
                            <option value="Adventure">⚔️ Adventure</option>
                            <option value="Funny">😄 Funny</option>
                            <option value="Dramatic">🎭 Dramatic</option>
                            <option value="Light-hearted">☀️ Light-hearted</option>
                            <option value="Emotional">💙 Emotional</option>
                            <option value="Poetic">🌸 Poetic</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="art_style">Art Style</label>
                        <select id="art_style" name="art_style" required>
                            <option value="Anime">🎌 Anime</option>
                            <option value="Comic Book">💥 Comic Book</option>
                            <option value="Cartoon">🎨 Cartoon</option>
                            <option value="Manga">📖 Manga</option>
                            <option value="Pixel Art">👾 Pixel Art</option>
                            <option value="Realistic">📷 Realistic</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="generateBtn" class="btn">
                    ✨ Generate My Comic
                </button>
            </form>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Creating your comic with AI magic...<br>This may take 1–2 minutes ☕</p>
            </div>
        </main>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('comicForm');
        const submitBtn = document.getElementById('generateBtn');
        const loadingDiv = document.getElementById('loading');
        if (form) {
            form.addEventListener('submit', (e) => {
                submitBtn.disabled = true;
                submitBtn.style.opacity = '0.7';
                submitBtn.textContent = 'Generating... Please wait';
                loadingDiv.classList.remove('hidden');
            });
        }
    });
    </script>
</body>
</html>
