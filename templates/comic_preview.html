<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Comic Preview — COMICCRAFT</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container comic-container">
        <header>
            <span class="logo">YOUR COMIC</span>
            <p class="tagline">✦ AI Generated Story ✦</p>
        </header>

        <main>
            <div class="comic-layout">
                {% for panel in panels %}
                <div class="comic-card">
                    <div class="panel-header">
                        <span class="panel-number">Panel {{ panel.panel_number }}</span>
                        <h2>{{ panel.title }}</h2>
                    </div>

                    <div class="panel-image-container">
                        <img src="{{ panel.image_path }}"
                             alt="Panel {{ panel.panel_number }}: {{ panel.title }}"
                             loading="lazy">
                    </div>

                    <div class="panel-content">
                        <p><strong>Scene</strong><br>{{ panel.scene_description }}</p>
                        <p class="caption"><strong>Caption</strong><br><em>{{ panel.caption }}</em></p>
                        <p class="narration"><strong>Narration</strong><br>{{ panel.narration }}</p>
                        <p class="dialogue"><strong>Dialogue</strong><br>"{{ panel.dialogue }}"</p>
                    </div>
                </div>
                {% endfor %}
            </div>

            <div class="actions">
                <a href="/download/{{ pdf_filename }}" class="btn" id="downloadBtn">
                    ⬇ Download PDF
                </a>
                <a href="/" class="btn btn-secondary">
                    ✦ Create Another
                </a>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('downloadBtn').addEventListener('click', function() {
            setTimeout(() => { window.location.href = '/export-success'; }, 1200);
        });
    </script>
</body>
</html>
